# GitHub Pages - WW2 Strategy Oyunu
# Her main push'ta otomatik olarak GitHub Pages'e deploy eder

name: 🌐 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manuel tetikleme de mümkün

# GitHub Pages için gerekli izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Eş zamanlı sadece 1 deploy çalışsın
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tüm repo kökünü yükle (index.html, assets/, js dosyaları)
          path: '.'

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
